name: Pr Checker

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"

      # package.json requires Yarn 4.17.1 via "packageManager". The runner's
      # preinstalled Yarn is 1.x and refuses to install until Corepack is on.
      - name: Use Yarn 4 via Corepack
        run: |
          corepack enable
          yarn --version

      - run: yarn install --immutable

      - run: yarn astro check

      - run: NODE_OPTIONS="--max-old-space-size=4096" yarn build

  visual-testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"

      - name: Use Yarn 4 via Corepack
        run: |
          corepack enable
          yarn --version

      - run: yarn install --immutable

      - run: yarn add @percy/cli -D

      - run: mkdir -p theme-dist/light && mkdir -p theme-dist/dark

      - run: yarn build:light --base light

      - run: cp -R dist/* theme-dist/light

      - run: yarn build:dark --base dark

      - run: cp -R dist/* theme-dist/dark

      - run: npx percy snapshot theme-dist/
        env:
          PERCY_TOKEN: ${{secrets.PERCY_TOKEN}}
